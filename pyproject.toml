[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atalla-mini"
version = "0.1.0"
description = "Isolated Atalla MEISSA dense compute baseline for sparsity research"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
mini-sim = "mini_sim.cli:main"
mini-generate = "mini_sim.workloads:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

